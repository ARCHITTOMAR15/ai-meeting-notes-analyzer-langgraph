
project:
  name: AI Meeting Notes Analyzer
  version: 1.0

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  faiss_index: data/faiss/index
  logs: logs

llm:
  provider: local
  model_name: Qwen2.5-3B-Instruct.gguf
  model_path: models/qwen2.5-3b-instruct-q4_k_m.gguf
  temperature: 0.2
  max_tokens: 500
  context_window: 4096
  gpu_layers: 0

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2

rag:
  chunk_size: 512
  chunk_overlap: 50
  top_k: 5

logging:
  level: INFO
  log_file: logs/project.log
